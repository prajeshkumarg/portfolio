<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'Switzer', system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f8f7e"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="#0d1412"/>

  <!-- title -->
  <text x="60" y="78" fill="#e8e6dc" font-size="40" font-weight="600" letter-spacing="-1">AnyLang</text>
  <text x="60" y="110" fill="#94a09a" font-size="19">A four-stage compiler: typed source &#8594; RISC-V, verified on a hand-written simulator.</text>

  <!-- two front-end sources -->
  <!-- Fish -->
  <g>
    <rect x="60" y="160" width="300" height="104" rx="6" fill="#16211e" stroke="#2c3b36"/>
    <text x="84" y="196" fill="#9fc7b8" font-size="22" font-weight="600">Fish</text>
    <text x="84" y="222" fill="#c7c6bd" font-size="15">Imperative &#183; simple statements</text>
    <text x="84" y="248" fill="#94a09a" font-size="14" font-family="monospace">fish_compile.ml &#183; direct codegen</text>
  </g>
  <!-- Scish -->
  <g>
    <rect x="420" y="160" width="300" height="104" rx="6" fill="#16211e" stroke="#2c3b36"/>
    <text x="444" y="196" fill="#9fc7b8" font-size="22" font-weight="600">Scish</text>
    <text x="444" y="222" fill="#c7c6bd" font-size="15">Functional &#183; closures, lambdas</text>
    <text x="444" y="248" fill="#94a09a" font-size="14" font-family="monospace">scish_compile.ml &#183; closures</text>
  </g>

  <!-- Cish -->
  <g>
    <rect x="420" y="330" width="300" height="104" rx="6" fill="#16211e" stroke="#2c3b36"/>
    <text x="444" y="366" fill="#9fc7b8" font-size="22" font-weight="600">Cish</text>
    <text x="444" y="392" fill="#c7c6bd" font-size="15">Functions, heap, pointers</text>
    <text x="444" y="418" fill="#94a09a" font-size="14" font-family="monospace">cish_compile.ml &#183; stack frames</text>
  </g>

  <!-- RISC-V AST -->
  <g>
    <rect x="60" y="500" width="660" height="78" rx="6" fill="#16211e" stroke="#2c3b36"/>
    <text x="84" y="536" fill="#cfe6dc" font-size="22" font-weight="600">RISC-V AST</text>
    <text x="84" y="562" fill="#94a09a" font-size="14" font-family="monospace">riscv_assem.ml &#183; encoding</text>
  </g>

  <!-- 32-bit machine code -->
  <g>
    <rect x="770" y="500" width="370" height="78" rx="6" fill="#16211e" stroke="#2c3b36"/>
    <text x="794" y="536" fill="#cfe6dc" font-size="22" font-weight="600">32-bit machine code</text>
    <text x="794" y="562" fill="#94a09a" font-size="14" font-family="monospace">riscv_sim.ml &#183; fetch-decode-execute</text>
  </g>

  <!-- program output -->
  <g>
    <rect x="770" y="630" width="370" height="64" rx="6" fill="#9fc7b8"/>
    <text x="794" y="670" fill="#0d1412" font-size="22" font-weight="600">Program output</text>
  </g>

  <!-- arrows -->
  <!-- Fish -> RISC-V AST (down-left) -->
  <path d="M150 264 L150 500" stroke="#5f8f7e" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <!-- Scish -> Cish -->
  <path d="M570 264 L570 330" stroke="#5f8f7e" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <!-- Cish -> RISC-V AST (down, into the shared AST) -->
  <path d="M500 434 L420 500" stroke="#5f8f7e" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <!-- RISC-V AST -> machine code -->
  <path d="M720 539 L770 539" stroke="#5f8f7e" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
  <!-- machine code -> output -->
  <path d="M955 578 L955 630" stroke="#5f8f7e" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>
</svg>
