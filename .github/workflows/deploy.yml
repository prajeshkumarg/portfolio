name: CI

# Checks only. Deploys are done by Netlify's own GitHub integration (site
# praj3sh-dev): a deploy preview for every PR, production on every push to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a newer push to the same branch supersedes an in-flight run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
